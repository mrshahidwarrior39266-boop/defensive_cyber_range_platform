apiVersion: v1
kind: Namespace
metadata:
  name: defensive-cyber-range
  labels:
    security.zone: isolated-simulation
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-external-egress
  namespace: defensive-cyber-range
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-range-orchestrator
  namespace: defensive-cyber-range
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyber-range-orchestrator
  template:
    metadata:
      labels:
        app: cyber-range-orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: orchestrator
          image: defensive-cyber-range:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CYBER_RANGE_ISOLATED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
