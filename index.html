<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d060a" />
    <meta
      name="description"
      content="Citadel — an autonomous defensive cyber range. Swarms audit code, synthesize verified cryptographic patches, and seal defenses in an immutable audit ledger."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Citadel — Defensive Cyber Range</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown only if JavaScript fails to load -->
      <noscript style="display:flex;min-height:100svh;align-items:center;justify-content:center;background:#070305;color:#f7f2e8;font-family:system-ui,sans-serif;text-align:center;padding:24px;flex-direction:column;gap:12px;">
        <strong style="font-size:1.25rem;">Citadel requires JavaScript</strong>
        <span style="color:#9baa97;font-size:0.9rem;">Please enable JavaScript in your browser to use the Defensive Cyber Range Platform.</span>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // JS bundle load failure fallback
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML = '<div style="display:flex;min-height:100svh;align-items:center;justify-content:center;background:#070305;color:#f7f2e8;font-family:system-ui,sans-serif;text-align:center;padding:24px;flex-direction:column;gap:12px;"><strong style=\'font-size:1.25rem;\'>Failed to load Citadel</strong><span style=\'color:#9baa97;font-size:0.9rem;\'>The application bundle could not be loaded. Please check your network connection and refresh the page.</span><button onclick="location.reload()" style=\'margin-top:16px;padding:10px 20px;background:#781c38;color:#f7f2e8;border:none;border-radius:8px;cursor:pointer;font-size:0.9rem;\'>Retry</button></div>';
          }
        }
      }, true);
    </script>
  </body>
</html>
